<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adam Script Hub</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background -->
    <div class="background"></div>

    <!-- Navigation -->
    <header class="navbar">
        <div class="logo">
            ⚡ Adam Script Hub
        </div>

        <button id="contactButton" class="contact-btn">
            Contact
        </button>
    </header>

    <!-- Hero -->
    <section class="hero">

        <h1>Adam Script Hub</h1>

        <p>
            Modern Roblox Scripts for Developers
        </p>

        <span class="hero-small">
            Clean • Fast • Updated Frequently
        </span>

    </section>

    <!-- Scripts -->
    <main class="container">

        <h2 class="section-title">
            Latest Scripts
        </h2>

        <div id="scriptContainer" class="scripts-grid">

        </div>

    </main>

    <!-- Footer -->
    <footer>

        <p>Made with ❤️ for Roblox Developers</p>

        <p>© 2026 Adam Script Hub</p>

    </footer>

    <!-- Overlay -->
    <div id="overlay" class="overlay"></div>

    <!-- Contact Popup -->
    <div id="contactPopup" class="popup">

        <button id="closePopup" class="close-popup">
            ✕
        </button>

        <h2>Contact Adam</h2>

        <p>
            Have a question, found a bug,
            or want to suggest a new script?
        </p>

        <div class="email-box">

            <span>📧</span>

            <span>
                domikhorshid@gmail.com
            </span>

        </div>

    </div>

    <script src="scripts.js"></script>
    <script src="script.js"></script>

</body>
</html>
